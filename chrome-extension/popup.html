<!doctype html>
<html lang="zh-CN">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>农大选课助手</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main id="cau-popup-glass">
      <div class="badge">CAU</div>
      <div>
        <h1>选课余量监控助手</h1>

      <p class="note">扩展不保存账号、密码或 Cookie；只保存课程监控配置。</p>
    </main>
    <script src="popup.js"></script>
    <script src="liquid-glass.js"></script>
