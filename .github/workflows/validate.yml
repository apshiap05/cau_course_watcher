name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        run: |
          node --check chrome-extension/content.js
          node --check chrome-extension/background.js
          node --check chrome-extension/popup.js
          node --check chrome-extension/liquid-glass.js
          node --check userscript/cau-course-watcher.user.js

      - name: Parse Chrome manifest
        run: node -e "JSON.parse(require('node:fs').readFileSync('chrome-extension/manifest.json', 'utf8'))"

      - name: Check shared UI distributions
        run: node tools/build-ui.cjs --check

      - name: Run smoke test
        run: |
          node tests/background-smoke.test.cjs
          node tests/multi-mode.test.cjs
          node tests/panel-layout.test.cjs
          node tests/url-scope.test.cjs
          node tests/popup.test.cjs
          node tests/v140-features.test.cjs
          node tests/release-version.test.cjs

      - name: Verify mode-dependent panel rendering
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=1000 --dump-dom "file://$PWD/tests/panel-preview.html?mode=normal" | node tests/panel-render.test.cjs normal
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=1000 --dump-dom "file://$PWD/tests/panel-preview.html?mode=multi" | node tests/panel-render.test.cjs multi
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=1600 --dump-dom "file://$PWD/tests/panel-interaction-preview.html" | node tests/panel-interaction.test.cjs
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=1600 --dump-dom "file://$PWD/tests/panel-preview.html?mode=multi" | node tests/liquid-glass-render.test.cjs
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=1600 --dump-dom "file://$PWD/tests/panel-preview.html?mode=multi&script=userscript" | node tests/liquid-glass-render.test.cjs
