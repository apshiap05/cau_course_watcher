<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>多选模式面板预览</title>
    <style>
      body { min-height: 1400px; margin: 0; background: linear-gradient(#3a884d 0 92px, #f3f6f4 92px); font-family: "Microsoft YaHei", sans-serif; }
      .mock-page { margin: 125px 500px 0 25px; padding: 24px; border: 1px solid #cad7ce; background: white; color: #526158; }
    </style>
    <script>
      const previewMode = new URLSearchParams(window.location.search).get('mode') === 'normal' ? 'normal' : 'multi';
      window.chrome = window.chrome || {};
      window.chrome.storage = {
        local: {
          get: async () => ({
            'cau-course-watcher:chrome-config:v1': {
              mode: previewMode,
              courses: [
                { courseName: '羽毛球', teacher: '田野', minRemaining: 1, selectionStrategy: 'maxRemaining' },
                { courseName: '专业英语', teacher: '郝彦菊', minRemaining: 1, selectionStrategy: 'first' }
              ],
              intervalMs: 5000,
              jitterMs: 900,
              maxAttempts: 0,
              showFullCourses: true,
              autoConfirmAllPrompts: true,
              desktopNotification: true,
              sound: true,
              successPolicy: 'continue-until-all-selected'
            }
          }),
          set: async () => {}
        }
      };
    </script>
  </head>
  <body>
    <div class="mock-page">
      <h1>教务选课页面占位预览</h1>
      <p>本文件只用于检查扩展配置面板布局，不会访问教务系统或执行查询。</p>
    </div>
    <script src="../chrome-extension/content.js"></script>
    <script>
      setTimeout(() => {
        const panel = document.querySelector('#cau-course-watcher-panel');
        const addButton = document.querySelector('#cau-cw-add-course');
        const removeButtons = [...document.querySelectorAll('[data-remove-course]')];
        const courseBlocks = [...document.querySelectorAll('.cau-cw-course-block')];
        const visible = (element) => getComputedStyle(element).display !== 'none';
        document.body.dataset.cauPanelReady = String(Boolean(panel));
        document.body.dataset.cauActiveMode = panel?.dataset.mode || 'missing';
        document.body.dataset.cauAddVisible = String(Boolean(addButton && visible(addButton)));
        document.body.dataset.cauVisibleCourseCount = String(courseBlocks.filter(visible).length);
        document.body.dataset.cauVisibleRemoveCount = String(removeButtons.filter(visible).length);
        document.body.dataset.cauHealthItemCount = String(document.querySelectorAll('[data-health]').length);
        document.body.dataset.cauCourseStatusCount = String(document.querySelectorAll('[data-course-status]').length);
        document.body.dataset.cauStartModalHidden = String(document.querySelector('#cau-course-watcher-modal')?.hidden === true);
        document.body.dataset.cauContinuePolicy = String(document.querySelector('#cau-cw-continue-all')?.checked === true);
        document.body.dataset.cauContinuePolicyVisible = String(visible(document.querySelector('#cau-cw-continue-row')));
        if (new URLSearchParams(window.location.search).get('modal') === '1') {
          const modal = document.querySelector('#cau-course-watcher-modal');
          const summary = document.querySelector('#cau-cw-confirm-summary');
          summary.innerHTML = '<div><strong>模式：</strong>多选模式（2 门）</div><div><strong>1. 羽毛球</strong> · 最低余量 1<br><small>教师：田野；课序号：507</small></div><div><strong>2. 专业英语</strong> · 最低余量 1<br><small>教师：郝彦菊</small></div><div><strong>刷新：</strong>5 秒 + 0–900 ms 随机抖动</div><div><strong>成功策略：</strong>全部课程选中后停止</div><div><strong>弹窗：</strong>自动确认本次选课流程中的全部确认框</div><div><strong>页面：</strong>页面健康检查通过</div>';
          modal.hidden = false;
        }
      }, 250);
    </script>
  </body>
</html>
